---
name: Push

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ forge.workflow }}-${{ forge.ref }}

jobs:
  tests:
    name: Tests
    uses: ./.forgejo/workflows/tests.yml

  image:
    if: forge.ref_name == 'main'
    name: Image
    needs:
      - tests
    uses: ./.forgejo/workflows/image.yml
    secrets: inherit
    with:
      tag: main

  docs:
    name: Documentation
    needs:
      - tests
    uses: ./.forgejo/workflows/docs.yml
    secrets: inherit
