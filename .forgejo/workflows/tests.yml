---
name: Run tests
on:
  workflow_call:

jobs:
  vale:
    name: vale
    runs-on: home-linux-amd64
    container:
      image: codeberg.org/yorickpeterse/base-images/vale:latest
    steps:
      - uses: actions/checkout@v7
      - run: vale --no-wrap --sort .

  cargo-deny:
    runs-on: home-linux-amd64
    container:
      image: codeberg.org/yorickpeterse/base-images/rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo-deny check

  cargo-fmt:
    runs-on: home-linux-amd64
    container:
      image: codeberg.org/yorickpeterse/base-images/rust:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: amd64-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: 'cargo fmt --all --check'

  inko-fmt:
    runs-on: home-linux-amd64
    container:
      image: ghcr.io/inko-lang/ci/fedora:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: amd64-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: 'cargo run -- fmt --check'
        working-directory: std

  compiler-linux:
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: fedora
            name: amd64-linux-gnu
            runner: home-linux-amd64
          - image: alpine
            name: amd64-linux-musl
            runner: home-linux-amd64
          - image: fedora
            name: arm64-linux-gnu
            runner: home-linux-arm64
          - image: alpine
            name: arm64-linux-musl
            runner: home-linux-arm64
    name: ${{ matrix.target.name }} compiler
    timeout-minutes: 15
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/inko-lang/ci/${{ matrix.target.image }}:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.target.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo --version
      - run: cargo test

  std-linux:
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ''
          - '--release'
        target:
          - image: fedora
            name: amd64-linux-gnu
            runner: home-linux-amd64
          - image: alpine
            name: amd64-linux-musl
            runner: home-linux-amd64
          - image: fedora
            name: arm64-linux-gnu
            runner: home-linux-arm64
          - image: alpine
            name: arm64-linux-musl
            runner: home-linux-arm64
    needs:
      - compiler-linux
    name: ${{ matrix.target.name }} std ${{ matrix.flags }}
    timeout-minutes: 15
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/inko-lang/ci/${{ matrix.target.image }}:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.target.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: uname -a
      - run: cargo --version
      - name: Run tests
        run: 'cargo run -- test --verify ${{ matrix.flags }}'
        working-directory: std

  compiler-mac:
    name: arm64-mac-native compiler
    timeout-minutes: 15
    runs-on: home-macos-arm64
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: arm64-mac-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo --version
      - run: cargo test -- --test-threads=2

  std-mac:
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ''
          - '--release'
    needs:
      - compiler-mac
    name: arm64-mac-native std ${{ matrix.flags }}
    timeout-minutes: 15
    runs-on: home-macos-arm64
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: arm64-mac-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo --version
      - name: Run tests
        run: 'cargo run -- test --threads=2 --verify ${{ matrix.flags }}'
        working-directory: 'std'

  compiler-freebsd:
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: amd64-freebsd-native
            runner: home-freebsd-amd64
          - name: arm64-freebsd-native
            runner: home-freebsd-arm64
    name: ${{ matrix.target.name }} compiler
    timeout-minutes: 15
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.target.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo --version
      - run: cargo test

  std-freebsd:
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ''
          - '--release'
        target:
          - name: amd64-freebsd-native
            runner: home-freebsd-amd64
          - name: arm64-freebsd-native
            runner: home-freebsd-arm64
    needs:
      - compiler-freebsd
    name: ${{ matrix.target.name }} std ${{ matrix.flags }}
    timeout-minutes: 15
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.target.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo --version
      - name: Run tests
        run: 'cargo run -- test --verify ${{ matrix.flags }}'
        working-directory: std
