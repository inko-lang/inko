---
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    uses: ./.forgejo/workflows/tests.yml

  source:
    name: Source archive
    runs-on: home-linux-amd64
    container:
      image: ghcr.io/inko-lang/ci/fedora:latest
    needs:
      - tests
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory $PWD
      - run: just release source
      - run: just release manifest

  runtimes:
    name: Runtimes
    needs:
      - tests
    uses: ./.forgejo/workflows/runtimes.yml
    secrets: inherit

  docs:
    name: Documentation
    needs:
      - tests
    uses: ./.forgejo/workflows/docs.yml
    secrets: inherit
    with:
      release: true

  image:
    name: Image
    needs:
      - tests
    uses: ./.forgejo/workflows/image.yml
    secrets: inherit
    with:
      tag: ${{ forge.ref_name }}
