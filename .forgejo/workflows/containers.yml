---
name: Build CI containers
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/container.yml'
      - '.forgejo/workflows/containers.yml'
      - 'ci/docker/*/*'

concurrency:
  group: ${{ forge.workflow }}-${{ forge.ref }}
  cancel-in-progress: ${{ forge.event_name == 'pull_request' }}

