---
name: Build cross-compilation runtimes
on:
  workflow_call:

jobs:
  linux:
    strategy:
      matrix:
        target:
          - image: fedora
            name: amd64-linux-gnu
            runner: home-linux-amd64
          - image: alpine
            name: amd64-linux-musl
            runner: home-linux-amd64
          - image: fedora
            name: arm64-linux-gnu
            runner: home-linux-arm64
          - image: alpine
            name: arm64-linux-musl
            runner: home-linux-arm64
    name: ${{ matrix.target.name }} runtimes
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/inko-lang/ci/${{ matrix.target.image }}:latest
    steps:
      - uses: actions/checkout@v7
      - run: just release runtimes ${{ matrix.target.name }}

  freebsd:
    strategy:
      matrix:
        target:
          - name: amd64-freebsd-native
            runner: home-freebsd-amd64
          - name: arm64-freebsd-native
            runner: home-freebsd-arm64
    name: ${{ matrix.target.name }} runtimes
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: just release runtimes ${{ matrix.target.name }}

  macos:
    strategy:
      matrix:
        target:
          - name: arm64-macos-native
            runner: home-macos-arm64
    name: ${{ matrix.target.name }} runtimes
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: just release runtimes ${{ matrix.target.name }}
